# Kuratierter Engine/Modell-Katalog fürs Dashboard-Dropdown (Loop-Runner v1).
# Struktur: engines.<name>.{label, models}. "models: []" heißt "Katalog-Eintrag ohne
# Adapter" (Dashboard zeigt die Engine, aber Start ist gesperrt).
#
# SINGLE SOURCE OF TRUTH für den Claude-Abo-Katalog (`engines.claude.models`).
# Ein neues Claude-Modell wird GENAU HIER eingetragen; alles andere speist daraus:
#   - Loops-Tab + Loop-Runner  → dieser Katalog direkt (fail-closed Membership-Check
#     in loops/runner.py `_validate_effective_phase_catalog`)
#   - Lanes-Tab + Fleet→Heute  → hermes_cli/claude_cli_model_catalog.py, das die
#     Liste in Lane-Optionen übersetzt (plugins/kanban/dashboard/lane_routes.py)
#   - Frontend-Fallbacks       → web/src/control/generated/claudeModels.ts, erzeugt
#     von scripts/sync_model_catalog.py (Drift ist gate-rot)
# Die Einträge müssen `claude --model <id>` akzeptieren (`claude -p` = Max-Abo-Lane).
# Die Reihenfolge ist die Anzeigereihenfolge in den Dropdowns.
# Codex-Modell 2026-07-31 live gegen Codex CLI 0.145.0 geprüft:
# `codex exec -m gpt-5.6-luna -c model_reasoning_effort=low "ping"` → exit 0;
# `codex exec -m gpt-5.6-terra -c model_reasoning_effort=medium "ping"` → exit 0.
# Sol bleibt zuerst; Terra/Luna sind die konservativen First-Pass-/Sweep-Lanes,
# gpt-5.5/gpt-5.3-codex bleiben als bewiesene Fallbacks im Katalog.
# neuralwatt-Modelle: vollständige auf diesem Host konfigurierte Auswahl
# (`model_catalog.providers.neuralwatt.extra_models`, geprüft 2026-07-12).
engines:
  claude:
    label: "Claude (Abo)"
    # claude-opus-5 live gegen die CLI geprüft 2026-07-25:
    # `claude -p --model claude-opus-5 --effort xhigh` → exit 0.
    models:
      - claude-fable-5
      - claude-opus-5
      - claude-opus-4-8
      - claude-sonnet-5
      - claude-sonnet-4-6
      - claude-haiku-4-5
  kimi:
    label: "Kimi (Coding-Abo)"
    models: [kimi-code/kimi-for-coding, k3]
  codex:
    label: "Codex (ChatGPT-Abo)"
    # Der Provider-Slug ist mit dem Engine-Namen nicht namensverwandt
    # (codex ↔ openai-codex), deshalb hier als Daten deklariert. Alle anderen
    # Engines finden ihre Provider über die Namensverwandtschaft von selbst.
    inventory_providers: [openai-codex]
    models: [gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna, gpt-5.5, gpt-5.3-codex]
  hermes:
    # "Modell" = Hermes-PROFIL; das Profil trägt die Provider-/Modell-Bindung.
    # reviewer → glm-5.2 @ NeuralWatt · coder → Codex-Pool (live verifiziert 2026-07-02).
    label: "Hermes-Profil (NeuralWatt/Codex-Pool via Abo)"
    models: [reviewer, coder]
  neuralwatt:
    label: "NeuralWatt (Abo)"
    models:
      - glm-5.2
      - glm-5.2-fast
      - glm-5.2-short
      - glm-5.2-short-fast
      - kimi-k2.6
      - kimi-k2.6-fast
      - kimi-k2.7-code
      - kimi-k2.5-fast
      - moonshotai/Kimi-K2.5
      - qwen3.5-397b
      - qwen3.5-397b-fast
      - qwen3.6-35b
      - qwen3.6-35b-fast
  xai:
    label: "xAI / Grok (Abo)"
    models: [grok-4.5]
  alibaba-token-plan:
    label: "Alibaba Token Plan (Abo)"
    models: [qwen3.8-max-preview]
